
on: push

jobs:
  test-idiorm-against-php-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.0', '8.1', '8.2', '8.3']

    name: PHP ${{ matrix.php-versions }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: pdo_sqlite
          coverage: none
          tools: composer

      # PHPUnit comes from require-dev rather than a setup-php tool download, so
      # CI runs the version composer.json pins. The old matrix pinned a PHPUnit
      # per PHP version and sed-patched setUp() signatures on the fly; the tests
      # now carry those signatures themselves.
      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run phpunit tests
        run: composer run-script test -- --colors
